<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Guitar Lab — Redirection</title>
    <style>
      html, body { height: 100%; margin: 0; background: #111827; color: #fff; font: 500 14px/1.4 system-ui, sans-serif; }
      #redirect { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
      a { color: #fbbf24; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="redirect">
      <p>Mise à jour de Guitar Lab…<br><a href="/">Clique ici si tu n’es pas redirigé.</a></p>
    </div>
    <script>
      (function () {
        var target = '/' + (location.search || '');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
            .then(function () { location.replace(target); })
            .catch(function () { location.replace(target); });
        } else {
          location.replace(target);
        }
      })();
    </script>
  </body>
</html>
