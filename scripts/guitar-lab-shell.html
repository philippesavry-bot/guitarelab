<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Guitar Lab — Mes fiches de formation guitare</title>
    <meta name="description" content="Bibliothèque et fiches de travail pour mes morceaux de guitare, avec sauvegarde locale et synchronisation par fichier iCloud." />
    <script>
      // Avertissements attendus et sans impact ici (pas d'étape de build possible dans ce contexte) : filtrés silencieusement.
      (function () {
        const originalWarn = console.warn;
        const silenced = ['in-browser Babel transformer', 'cdn.tailwindcss.com should not be used in production'];
        console.warn = function (...args) {
          if (typeof args[0] === 'string' && silenced.some(s => args[0].includes(s))) return;
          originalWarn.apply(console, args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { gray: { 750: '#333d4b' } } } },
      };
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #111827; color: #fff; -webkit-text-size-adjust: 100%; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 14px/1.4 system-ui, sans-serif; color: #fbbf24; background: #111827; z-index: 50; }
    </style>
  </head>
  <body>
    <div id="boot">Chargement de Guitar Lab…</div>
    <div id="root"></div>

    <script>
      // --- Stockage persistant local (IndexedDB — quota bien plus généreux que localStorage,
      //     essentiel car les fiches contiennent des photos encodées en base64) ---
      var LS_PREFIX = 'guitar-lab-html:';
      var DB_NAME = 'guitar-lab-db';
      var STORE_NAME = 'kv';
      var _dbPromise = null;

      function openDb() {
        if (_dbPromise) return _dbPromise;
        _dbPromise = new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE_NAME); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
        return _dbPromise;
      }
      function idbGet(db, key) {
        return new Promise(function (resolve) {
          var req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(key);
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { resolve(undefined); };
        });
      }
      function idbSet(db, key, value) {
        return new Promise(function (resolve) {
          var tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(value, key);
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        });
      }
      function idbGetAllPrefixed(db, prefix) {
        return new Promise(function (resolve) {
          var out = {};
          var req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).openCursor();
          req.onsuccess = function (e) {
            var cursor = e.target.result;
            if (cursor) {
              if (typeof cursor.key === 'string' && cursor.key.indexOf(prefix) === 0) out[cursor.key] = cursor.value;
              cursor.continue();
            } else resolve(out);
          };
          req.onerror = function () { resolve(out); };
        });
      }

      window.storage = {
        get: async function (key) {
          try {
            var db = await openDb();
            var fullKey = LS_PREFIX + key;
            var v = await idbGet(db, fullKey);
            if (v !== undefined) return { value: v };
            // Migration transparente et silencieuse depuis l'ancien stockage localStorage, si des données y sont encore présentes
            var legacy = null;
            try { legacy = localStorage.getItem(fullKey); } catch (e) {}
            if (legacy !== null) {
              idbSet(db, fullKey, legacy).catch(function () {});
              return { value: legacy };
            }
            return null;
          } catch (e) { return null; }
        },
        set: async function (key, value) {
          try {
            var db = await openDb();
            return await idbSet(db, LS_PREFIX + key, value);
          } catch (e) { return false; }
        },
        // Estimation du stockage utilisé / disponible pour cette appli (affiché dans l'écran d'accueil)
        estimate: async function () {
          try {
            if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate();
          } catch (e) {}
          return null;
        },
        // Sauvegarde complète : reprend toutes les clés de l'appli (morceaux, préférences, réglages...)
        exportBackup: async function () {
          var db = await openDb();
          var entries = await idbGetAllPrefixed(db, LS_PREFIX);
          return { app: 'guitar-lab', version: 2, exportedAt: new Date().toISOString(), data: entries };
        },
        importBackup: async function (payload) {
          if (!payload || typeof payload.data !== 'object') throw new Error('format de fichier invalide');
          var db = await openDb();
          var keys = Object.keys(payload.data);
          for (var i = 0; i < keys.length; i++) {
            var v = payload.data[keys[i]];
            if (typeof v === 'string') await idbSet(db, keys[i], v);
          }
          return true;
        },
      };

      // --- Icônes lucide exposées comme composants React ---
      (function () {
        var source = (window.lucide && window.lucide.icons) || window.lucide || {};
        var cache = {};
        function toComponent(name, node) {
          if (cache[name]) return cache[name];
          var C = function (props) {
            props = props || {};
            var size = props.size || 24;
            var attrs = {
              xmlns: 'http://www.w3.org/2000/svg', width: size, height: size,
              viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
              strokeWidth: props.strokeWidth || 2, strokeLinecap: 'round', strokeLinejoin: 'round',
              className: props.className, style: props.style, onClick: props.onClick,
            };
            // node = ["svg", attrs, children] (format lucide UMD)
            var raw = (node && node[2]) || [];
            var children = raw.map(function (child, i) {
              return React.createElement(child[0], Object.assign({ key: i }, child[1] || {}));
            });
            return React.createElement('svg', attrs, children);
          };
          C.displayName = name;
          cache[name] = C;
          return C;
        }
        window.Icons = new Proxy({}, {
          get: function (_t, name) {
            if (typeof name !== 'string') return undefined;
            var node = source[name] || source[name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()];
            return toComponent(name, node);
          },
        });
      })();
    </script>

    <script type="text/babel" data-presets="react">
      const { useState, useRef, useEffect, useMemo } = React;
      const {
        ChevronDown, ChevronRight, ChevronLeft, Plus, Music, X, Star, Menu, Edit2,
        Trash2, Play, Pause, BookOpen, Maximize2, Minimize2, ArrowDown, ArrowUp, Volume2, VolumeX,
        TrendingUp, Calendar, Zap, Search,
      } = window.Icons;

/* __APP_CODE__ */

      const bootEl = document.getElementById('boot');
      if (bootEl) bootEl.remove();
      ReactDOM.createRoot(document.getElementById('root')).render(<GuitarApp />);
    </script>
  </body>
</html>
